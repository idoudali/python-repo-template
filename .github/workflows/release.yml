name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: $/.github/workflows/build.yml

  binary:
    name: binary
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: $/.github/workflows/binary.yml

  publish:
    name: publish assets
    needs: [release-please, package, binary]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: artifacts
      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: artifacts
        run: |
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee SHA256SUMS
      - id: attest
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "artifacts/*"
      - name: Copy attestation bundle into artifacts
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" artifacts/
      - name: Upload assets to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload \
            "$TAG_NAME" \
            artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
