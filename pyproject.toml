[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-repo-template"
version = "0.1.0"
description = "Template Python package with a Typer CLI, uv, and modern tooling"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ioannis Doudalis" }]
keywords = ["python", "template", "typer", "cli", "uv"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/idoudali/python-repo-template"
Repository = "https://github.com/idoudali/python-repo-template"
Issues = "https://github.com/idoudali/python-repo-template/issues"

[project.scripts]
python-repo-template = "python_repo_template.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python_repo_template"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # conflicts with D211 (Google)
  "D213",   # conflicts with D212 (Google)
  "COM812", # conflicts with the formatter
  "COM819", # conflicts with the formatter
  "ISC001", # conflicts with the formatter
  "CPY001", # no per-file copyright header policy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
# Typer Option/Argument callbacks use bool flags by design.
"src/python_repo_template/cli.py" = ["FBT001", "FBT002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["python_repo_template"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "-ra",
  "--cov=python_repo_template",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-report=html",
]

[tool.coverage.run]
branch = true
source = ["python_repo_template"]
omit = ["*/python_repo_template/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
