[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-repo-template"
version = "0.1.0"
description = "Template Python package with a Typer CLI, uv, and modern tooling"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ioannis Doudalis" }]
keywords = ["python", "template", "typer", "cli", "uv"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/idoudali/python-repo-template"
Repository = "https://github.com/idoudali/python-repo-template"
Issues = "https://github.com/idoudali/python-repo-template/issues"

[project.scripts]
python-repo-template = "python_repo_template.cli:app"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/python_repo_template"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]
